[project]
name = "candidate-modeling"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["requests", "pyyaml", "python-dotenv", "pandas", "duckdb>=1.1", "mcp>=2", "scikit-learn>=1.3"]

[project.optional-dependencies]
dev = ["pytest", "responses", "matplotlib", "statsmodels>=0.14", "fpdf2"]
report = ["matplotlib"]
analysis = ["statsmodels>=0.14", "matplotlib", "fpdf2"]

[project.scripts]
cm = "candidate_modeling.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real APIs (deselect with -m 'not live')"]
addopts = "-m 'not live'"
