# Election calendar used by compare_elections(stage=...).
#
# Rules for editing (enforced by tests/test_calendar.py):
# - Every entry needs: state, date (YYYY-MM-DD), type, scope, description, source (URL).
# - Only add dates you have verified against a source. Never infer a date from a pattern.
# - type: primary | primary_runoff | general | general_runoff | presidential_primary | special
# - scope: statewide (contests on every ballot in the state) | local (only some jurisdictions vote)
# - General election days must equal the Tuesday after the first Monday in November.
# - status: held (default) | scheduled (not yet happened as of when it was added)

